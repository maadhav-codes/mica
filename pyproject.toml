[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mica"
version = "0.1.0"
description = "Mica — Local conversations, powered by MLX."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx==0.32.3",
    "mlx-lm==0.32.0",
    "huggingface-hub",
    "typer",
    "rich",
    "prompt-toolkit",
]

[project.scripts]
mica = "mica.cli:app"

[project.optional-dependencies]
voice = [
    "en-core-web-sm",
    "misaki[en]==0.9.4",
    "mlx-audio==0.4.3",
    "mlx-whisper==0.4.3",
    "sounddevice==0.5.3",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mica"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
